<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0506;
            color: #f0e8e8;
        }

        .card {
            text-align: center;
            padding: 60px 80px;
            background: #140d10;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            color: #e8d5d5;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #fff;
            display: inline-block;
        }

        .btn-2 {
            background: #9B3A4A;
        }

        .btn-2:hover {
            background: #7B2D3B;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(155, 58, 74, 0.5);
        }

        /* Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: #7B2D3B;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-btn:hover {
            background: #5E1F2A;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(123, 45, 59, 0.5);
        }

        .dropdown-btn::after {
            content: '▾';
            font-size: 0.8rem;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #1e1215;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            min-width: 180px;
            overflow: hidden;
            z-index: 10;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            display: block;
            padding: 12px 20px;
            color: #e8d5d5;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.15s ease;
        }

        .dropdown-content a:hover {
            background: #7B2D3B;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Manu's Homepage</h1>
        <div class="buttons">
           <div class="dropdown">
   		 <button class="dropdown-btn">Skyguard</button>
  		  <div class="dropdown-content">
  		      <a href="https://manudurga.github.io/SkyGuard/ChatGPT_v1">ChatGPT v1</a>
   	  	      <a href="https://manudurga.github.io/SkyGuard/ChatGPT_v2">ChatGPT v2</a>
		      <a href="https://manudurga.github.io/SkyGuard/ChatGPT_v3">ChatGPT v3</a>
		      <a href="https://manudurga.github.io/SkyGuard/ChatGPT_v4">ChatGPT v4</a>
    		  <a href="https://manudurga.github.io/SkyGuard/Claude_v1">Claude v1</a>
    		  <a href="https://manudurga.github.io/SkyGuard/Claude_v2">Claude v2</a>
  	          </div>
             </div>   
            <a class="btn btn-2" href="https://manudurga.github.io/Neurobooster/">Neurobooster</a>
            <a class="btn btn-2" href="https://manudurga.github.io/ParliamentOS/">ParliamentOS</a>
        </div>
    </div>
</body>
</html>
